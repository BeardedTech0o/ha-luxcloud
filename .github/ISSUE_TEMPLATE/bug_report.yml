name: Bug Report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible to help us diagnose the issue quickly.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have read the [troubleshooting guide](https://github.com/BeardedTech0o/ha-luxcloud#troubleshooting)
          required: true
        - label: I am using the latest version of LuxCloud
          required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2024.5.3
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: LuxCloud version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: inverter_model
    attributes:
      label: Inverter model
      placeholder: e.g. LXP 5kW Hybrid
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Paste any relevant lines from **Settings → System → Logs** filtered by `luxcloud`.
        These will be automatically formatted as code.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might be relevant.
    validations:
      required: false
